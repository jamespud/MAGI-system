# MAGI Prometheus alert rules (example).
# Pair with backend /metrics and the OTLP/HTTP tracing exporter. Alertmanager
# wiring is deployment-specific; these are the thresholds that matter.
groups:
  - name: magi-runtime
    rules:
      - alert: MagiRunFailuresHigh
        expr: rate(magi_runs_failed_total[5m]) / clamp_min(rate(magi_runs_completed_total[5m]) + rate(magi_runs_failed_total[5m]), 1) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Over 30% of MAGI runs failing in the last 5 minutes"
      - alert: MagiRunQueueBacklog
        expr: magi_runs_active > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusually many active runs"
      - alert: MagiToolFailureSpike
        expr: rate(magi_tool_call_failures_total[5m]) / clamp_min(rate(magi_tool_calls_total[5m]), 1) > 0.4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tool failure rate above 40%"
      - alert: MagiWebSearchProviderFailover
        expr: increase(magi_web_search_failovers_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A search provider failed and traffic moved to a fallback"
      - alert: MagiFeedbackViolationSpike
        expr: increase(magi_feedback_violations_total[15m]) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Model outputs are repeatedly failing deterministic checks"
      - alert: MagiBenchmarkRegressionFailure
        expr: increase(magi_benchmark_regression_failures_total[1h]) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "An automated benchmark run failed the regression gate"
      - alert: MagiModelProviderFailover
        expr: increase(magi_model_failovers_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A model provider failed and traffic moved to a fallback"
      - alert: MagiCostRunaway
        expr: increase(magi_cost_usd_total[1h]) > 5
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Spending more than $5/hour on model calls"
      - alert: MagiArtifactPersistFailures
        expr: increase(magi_artifact_persist_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Durable artifact writes failed and were tolerated ({{ $labels.kind }})"
          description: "A vote/evidence/tool-call row did not persist; the case may look complete while its audit trail has holes."
      - alert: MagiToolOutputClipped
        expr: increase(magi_tool_output_clipped_total[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "A tool returned more than the persistable output limit and was truncated"
      - alert: MagiToolErrorClipped
        expr: increase(magi_tool_error_clipped_total[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "A tool failure message exceeded the persistable error limit and was truncated"
          description: "Tool errors are untrusted input: a multi-megabyte message would overflow magi_tool_call.err and the tool-call-failed event payload."
      - alert: MagiCommitFenceFallback
        expr: increase(magi_commit_fence_fallback_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Status transitions are committing without the atomic fence ({{ $labels.op }})"
          description: "The wired repository no longer implements TerminalCommitter/StatusTransitionCommitter, so the status write, its artifacts, and its event are no longer one transaction."
      - alert: MagiToolEffectOverride
        expr: increase(magi_tool_effect_override_total[1h]) > 0
        labels:
          severity: info
        annotations:
          summary: "An operator override decided a tool's effect class ({{ $labels.from }} -> {{ $labels.to }})"
          description: "The server did not declare this class, so the configured effect_overrides set it. A tool that may now be re-invoked after an ambiguous failure should be traceable to this decision."
      - alert: MagiMemoryRetrievalFailures
        expr: increase(magi_memory_retrieval_failures_total[15m]) > 3
        labels:
          severity: warning
        annotations:
          summary: "RAG retrieval is failing"
      - alert: MagiA2AProjectionErrors
        expr: increase(magi_a2a_projection_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A2A task projection is dropping artifacts or status ({{ $labels.kind }})"
      - alert: MagiProtectionDisabled
        expr: magi_config_protection_disabled == 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "A protective mechanism is disabled ({{ $labels.name }})"
          description: "See docs/reliability-hazard-audit.md §4.1: a zero/absent value silently disables this guard."
