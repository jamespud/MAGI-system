# Source: magi/templates/frontend-nginx-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: magi-frontend-nginx
  labels:
    helm.sh/chart: magi-0.1.0
    app.kubernetes.io/name: magi
    app.kubernetes.io/instance: magi
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://magi-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }

      location /health {
        proxy_pass http://magi-backend:8080;
      }

      # Prometheus scrape endpoint. Restrict this to Prometheus source networks.
      location = /metrics {
        proxy_pass http://magi-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      # A2A protocol + Agent Card discovery: long-lived streams must not be
      # buffered, and the discovery JSON must reach the backend (not the SPA).
      location = /.well-known/agent-card.json {
        proxy_pass http://magi-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
      location /a2a/ {
        client_max_body_size 98304;
        proxy_pass http://magi-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
      }

      location / {
        try_files $uri /index.html;
      }
    }

