nameOverride: ""
fullnameOverride: ""

common:
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
    automountServiceAccountToken: false

backend:
  replicaCount: 1

  image:
    repository: magi-server
    # Overrides .Chart.AppVersion when set.
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080

  # Start with one replica during the first startup/schema migration, then
  # increase after the database is initialized. MAGI uses DB-backed scheduler
  # locks, durable jobs, shared run counters, and DB SSE polling for replicas.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  pdb:
    enabled: false
    minAvailable: 1

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

frontend:
  replicaCount: 2

  image:
    repository: magi-frontend
    # Defaults to the backend image tag so both images can be released together.
    tag: ""
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 80

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: true
    minAvailable: 1

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

configuration:
  dbDriver: mysql
  modelBaseURL: https://api.deepseek.com
  modelName: deepseek-v4-flash
  embeddingBaseURL: ""
  embeddingModelName: ""
  milvusAddress: milvus:19530
  esAddresses: http://elasticsearch:9200
  authEnabled: "true"

# For production, prefer secret.create=false plus an externally managed
# existingSecret. Never commit real values in Helm values files.
secret:
  create: true
  existingSecret: ""
  keys:
    dbDSN: db-dsn
    modelApiKey: model-api-key
    tavilyApiKey: tavily-api-key
    embeddingApiKey: embedding-api-key
    authAPIKeys: auth-api-keys
  values:
    dbDSN: ""
    modelApiKey: ""
    tavilyApiKey: ""
    embeddingApiKey: ""
    authAPIKeys: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: magi.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
