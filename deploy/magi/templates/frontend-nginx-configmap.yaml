apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "magi.fullname" . }}-frontend-nginx
  labels:
    {{- include "magi.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://{{ include "magi.fullname" . }}-backend:{{ .Values.backend.service.port }};
        proxy_http_version 1.1;
        proxy_set_header Host {{ print "$" }}host;
        proxy_set_header X-Real-IP {{ print "$" }}remote_addr;
        proxy_set_header X-Forwarded-For {{ print "$" }}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto {{ print "$" }}scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
      }

      location /health {
        proxy_pass http://{{ include "magi.fullname" . }}-backend:{{ .Values.backend.service.port }};
      }

      location / {
        try_files {{ print "$" }}uri /index.html;
      }
    }
