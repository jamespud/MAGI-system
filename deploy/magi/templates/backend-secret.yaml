{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "magi.fullname" . }}
  labels:
    {{- include "magi.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secret.keys.dbDSN }}: {{ required "secret.values.dbDSN is required when secret.create=true" .Values.secret.values.dbDSN | quote }}
  {{ .Values.secret.keys.modelApiKey }}: {{ required "secret.values.modelApiKey is required when secret.create=true" .Values.secret.values.modelApiKey | quote }}
  {{ .Values.secret.keys.tavilyApiKey }}: {{ default "" .Values.secret.values.tavilyApiKey | quote }}
  {{ .Values.secret.keys.embeddingApiKey }}: {{ default "" .Values.secret.values.embeddingApiKey | quote }}
  {{ .Values.secret.keys.authAPIKeys }}: {{ default "" .Values.secret.values.authAPIKeys | quote }}
{{- end -}}
