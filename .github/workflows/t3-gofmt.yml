name: T3 temporary gofmt helper

on:
  push:
    branches:
      - feat/artifact-generation-fencing

permissions:
  contents: write

jobs:
  gofmt:
    name: Format T3 Go changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/artifact-generation-fencing
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Format
        run: gofmt -w backend
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "chore(t3): gofmt"
          git push origin HEAD:feat/artifact-generation-fencing
