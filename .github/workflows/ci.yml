name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

  scripts:
    name: Operational scripts gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh

      - name: Smoke-test backup planning
        run: scripts/backup.sh --output "$RUNNER_TEMP/magi-backups" --dry-run

      - name: Smoke-test restore bundle verification
        run: |
          root="$RUNNER_TEMP/magi-restore-fixture"
          mkdir -p "$root/mysql" "$root/rag"
          printf '%s\n' '-- synthetic MySQL dump --' | gzip -c > "$root/mysql/mysql.sql.gz"
          for name in milvus es etcd minio; do
            printf '%s synthetic volume\n' "$name" | gzip -c > "$root/rag/$name.tar.gz"
          done
          cat > "$root/manifest.txt" <<'EOF'
          MAGI_BACKUP_FORMAT=1
          CREATED_AT_UTC=20260818T000000Z
          DB_NAME=magi
          MYSQL_DUMP=mysql/mysql.sql.gz
          EOF
          (
            cd "$root"
            find mysql rag -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -czf "$RUNNER_TEMP/magi-backup.tar.gz" -C "$root" manifest.txt SHA256SUMS mysql rag
          scripts/restore.sh --bundle "$RUNNER_TEMP/magi-backup.tar.gz" --dry-run

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  runtime-conformance:
    name: Runtime conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Execution kernel
        run: go test ./domain/execution/... -count=1

      - name: Model runtime
        run: go test ./domain/modelruntime/... -count=1

      - name: Tool runtime
        run: go test ./domain/toolruntime/... -count=1

      - name: Agent loop crash/recovery surface
        run: go test ./domain/runtime/... -run 'Crash|Resume|Checkpoint|Invocation' -count=1

      - name: Race across execution/model/tool kernels
        run: go test -race ./domain/execution/... ./domain/modelruntime/... ./domain/toolruntime/...

  # Separate from the backend gate on purpose: this job answers a different
  # question ("does the production database lifecycle hold on real MySQL?")
  # and fails for different reasons. It activates the MySQL-gated suites that
  # only run when MAGI_TEST_MYSQL_DSN is set, plus the schema lifecycle
  # scenarios in bootstrap/mysql_migration_test.go.
  mysql-migration:
    name: MySQL migration compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          # root@'%' so the runner (outside the service container) can connect
          # and so the scenarios may CREATE/DROP their own throwaway schemas.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: magi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      # SQLite cannot prove ALTER TABLE on a populated table, MySQL index
      # introspection, or InnoDB row-lock behaviour, so these suites are off by
      # default and CI is the only place they run.
      MAGI_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/magi_test?charset=utf8mb4&parseTime=True
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Schema lifecycle (fresh, upgrade, idempotent, S16 upgrade + repair)
        run: go test -p 1 -count=1 -v ./bootstrap/ -run 'TestMySQLMigration_|TestVerifyEventSequenceContract_MySQL'

      - name: MySQL-backed runtime invariants
        run: go test -p 1 -count=1 -v ./adapter/ -run 'MySQL'
