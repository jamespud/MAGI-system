name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test -race ./...

      - name: Run vet
        run: go vet ./...

  scripts:
    name: Operational scripts gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          bash -n scripts/backup.sh
          bash -n scripts/restore.sh

      - name: Smoke-test backup planning
        run: scripts/backup.sh --output "$RUNNER_TEMP/magi-backups" --dry-run

      - name: Smoke-test restore bundle verification
        run: |
          root="$RUNNER_TEMP/magi-restore-fixture"
          mkdir -p "$root/mysql" "$root/rag"
          printf '%s\n' '-- synthetic MySQL dump --' | gzip -c > "$root/mysql/mysql.sql.gz"
          for name in milvus es etcd minio; do
            printf '%s synthetic volume\n' "$name" | gzip -c > "$root/rag/$name.tar.gz"
          done
          cat > "$root/manifest.txt" <<'EOF'
          MAGI_BACKUP_FORMAT=1
          CREATED_AT_UTC=20260818T000000Z
          DB_NAME=magi
          MYSQL_DUMP=mysql/mysql.sql.gz
          EOF
          (
            cd "$root"
            find mysql rag -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -czf "$RUNNER_TEMP/magi-backup.tar.gz" -C "$root" manifest.txt SHA256SUMS mysql rag
          scripts/restore.sh --bundle "$RUNNER_TEMP/magi-backup.tar.gz" --dry-run

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
