# Default observability stack: Prometheus scraping MAGI + Alertmanager +
# Grafana with a pre-provisioned MAGI dashboard.
#
# Usage (web stack must be running first, `make web-up`):
#   make monitoring-up
#
#   Prometheus:  http://localhost:9090
#   Alertmanager: http://localhost:9093
#   Grafana:      http://localhost:3000  (admin / admin)
#
# Prometheus joins the magi-web_default network created by
# docker-compose-web.yml so it can scrape magi-server:8080/metrics.

name: magi-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: magi-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.example.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: magi-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: magi-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    name: magi-web_default
    external: true

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
