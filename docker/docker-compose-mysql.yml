name: magi-mysql
services:
  mysql:
    image: mysql:8.4.5
    container_name: magi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magi
      MYSQL_USER: magi
      MYSQL_PASSWORD: magi123
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'magi', '-pmagi123']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
