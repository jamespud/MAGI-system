server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to Go backend (includes SSE streaming)
    location /api/ {
        proxy_pass http://magi-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Health check
    location /health {
        proxy_pass http://magi-server:8080;
    }

    # Prometheus scrape endpoint. Restrict this to the Prometheus source
    # networks in production; it is intentionally unauthenticated for scraping.
    location = /metrics {
        proxy_pass http://magi-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2A protocol + Agent Card discovery: long-lived streams must not be
    # buffered, and the discovery JSON must reach the backend (not the SPA).
    location = /.well-known/agent-card.json {
        proxy_pass http://magi-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /a2a/ {
        client_max_body_size 96k;
        proxy_pass http://magi-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri /index.html;
    }
}
