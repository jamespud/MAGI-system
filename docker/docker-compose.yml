name: magi-dev

services:
  mysql:
    image: mysql:8.4.5
    container_name: magi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magi
      MYSQL_USER: magi
      MYSQL_PASSWORD: magi123
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./data/mysql:/var/lib/mysql
    profiles: [debug, server]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'magi', '-pmagi123']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  magi-server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: magi-server
    ports:
      - '127.0.0.1:8080:8080'
    profiles: [server]
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  magi-web:
    image: nginx:1.27-alpine
    container_name: magi-web
    ports:
      - '127.0.0.1:${WEB_PORT:-80}:80'
    profiles: [server]
    volumes:
      - ../bin/resources/static:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - magi-server
    restart: unless-stopped
