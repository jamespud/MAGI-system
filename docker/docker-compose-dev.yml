# Containerized local dev stack: mysql + magi-server + web (nginx).
# Used by `make web-up / web-down / web-logs / web-ps`.
#
# Secrets and the container DSN come from .env (compose auto-loads it); the
# magi-server image itself bakes no secrets (only conf/magi.yaml.example).
# mysql + magi-server are internal-only; only web exposes a host port (80), so
# the stack does not clash with `make debug` (go-run:8080 + nginx:80 debug).
# No explicit container_name is set so the stack can run alongside the dev
# middleware (whose mysql container is named magi-mysql); inter-service DNS uses
# service names (mysql, magi-server), not container names.
#
# Schema: magi-server runs GORM AutoMigrate on all models at startup
# (see bootstrap.provideDB).

name: magi-dev

services:
  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-magi}
      MYSQL_USER: ${DB_USER:-magi}
      MYSQL_PASSWORD: ${DB_PASS:-magi123}
    # Share data with `make debug` (dev middleware MySQL uses the same directory
    # at docker/data/mysql). Do NOT run `make docker-up` and `make up` at the
    # same time — two MySQL processes cannot share the data dir.
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-magi}", "-p${DB_PASS:-magi123}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  magi-server:
    build:
      context: ./backend
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MAGI_DB_DSN: "${DB_USER:-magi}:${DB_PASS:-magi123}@tcp(mysql:3306)/${DB_NAME:-magi}?charset=utf8mb4&parseTime=True"
      MAGI_DB_DRIVER: mysql
      MAGI_MODEL_API_KEY: ${MAGI_MODEL_API_KEY:-}
      MAGI_MODEL_BASE_URL: ${MAGI_MODEL_BASE_URL:-https://api.deepseek.com}
      MAGI_MODEL_NAME: ${MAGI_MODEL_NAME:-deepseek-v4-flash}
      MAGI_TAVILY_API_KEY: ${MAGI_TAVILY_API_KEY:-}
      MAGI_EMBEDDING_API_KEY: ${MAGI_EMBEDDING_API_KEY:-}
      MAGI_EMBEDDING_BASE_URL: ${MAGI_EMBEDDING_BASE_URL:-}
      MAGI_EMBEDDING_MODEL_NAME: ${MAGI_EMBEDDING_MODEL_NAME:-}
      MAGI_MILVUS_ADDRESS: ${MAGI_MILVUS_ADDRESS:-milvus-standalone:19530}
      MAGI_ES_ADDRESSES: ${MAGI_ES_ADDRESSES:-http://elasticsearch:9200}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      magi-server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # --- RAG infrastructure (Milvus + Elasticsearch) ---
  # `make rag_up` / `make rag_down` manage these independently of the core stack.
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  es_data:
