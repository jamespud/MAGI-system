# Debug middleware for `make debug`: MySQL (host port 3307 for go-run) + RAG
# (Milvus + Elasticsearch + etcd + minio). The go-run backend and nginx debug
# container run on the host (see scripts/dev.sh); this file provides only the
# stateful services they depend on.
#
# RAG data lives in external named volumes (magi-*-data), shared with
# docker-compose-web.yml so indexes persist when switching stacks. Run
# `make rag-prepare` once to create them (dev.sh does this automatically).
# MySQL shares docker/data/mysql with the web stack - run `make stop` before
# switching stacks.
#
# `make stop` tears this down together with the web stack.

name: magi-debug

services:
  mysql:
    image: mysql:8.4.5
    container_name: magi-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: magi
      MYSQL_USER: magi
      MYSQL_PASSWORD: magi123
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - ./docker/data/mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'magi', '-pmagi123']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # --- RAG infrastructure (shared with docker-compose-web.yml via external volumes) ---
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: magi-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: magi-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: magi-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: magi-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  milvus_data:
    external: true
    name: magi-milvus-data
  es_data:
    external: true
    name: magi-es-data
  etcd_data:
    external: true
    name: magi-etcd-data
  minio_data:
    external: true
    name: magi-minio-data
